server:
  port: 8080

app:
  base-url: ${APP_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  # disable elasticsearch actuator to avoid conflict with opensearch actuator
  elasticsearch:
    enabled: false

spring:
  application:
    name: opensearch-demo
  # Same shape as org.opensearch.spring.boot.autoconfigure.OpenSearchProperties.
  # Starter auto-config is excluded; OpenSearchAutoConfiguration in opensearch-util binds these.
  opensearch:
    uris: ${OPENSEARCH_URI}
    username: ${OPENSEARCH_USERNAME}
    password: "${OPENSEARCH_PASSWORD}"
    trust-self-signed: ${OPENSEARCH_TRUST_SELF_SIGNED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.acme.opensearchdemo: INFO
    org.opensearch: INFO
    org.springframework.data.elasticsearch: DEBUG
