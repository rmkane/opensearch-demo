server:
  port: 8080

app:
  base-url: ${APP_BASE_URL:}
  # Explicit client config — bound by OpenSearchAutoConfiguration in opensearch-util.
  opensearch:
    uri: ${OPENSEARCH_URI}
    username: ${OPENSEARCH_USERNAME}
    password: "${OPENSEARCH_PASSWORD}"
    trust-self-signed: ${OPENSEARCH_TRUST_SELF_SIGNED:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: opensearch-demo

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.acme.opensearchdemo: INFO
    org.opensearch: INFO
    org.springframework.data.elasticsearch: DEBUG
